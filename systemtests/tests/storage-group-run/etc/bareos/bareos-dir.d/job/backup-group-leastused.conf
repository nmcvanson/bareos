Job {
  Name = "backup-group-leastused"
  JobDefs = "DefaultJob"
  Client = "bareos-fd"
  MaximumConcurrentJobs = 10

  # Declares a policy by name so the resolver and the reported policy name
  # are covered end to end. With every member idle, LeastUsed sorts on equal
  # counters and stable_sort keeps the configured order, so File is still
  # chosen -- the observable is the policy name in the job log.
  Storage = File, File2
  Storage Group Policy = LeastUsed
}
