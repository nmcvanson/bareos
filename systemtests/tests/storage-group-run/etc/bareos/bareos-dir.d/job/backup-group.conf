Job {
  Name = "backup-group"
  JobDefs = "DefaultJob"
  Client = "bareos-fd"
  MaximumConcurrentJobs = 10

  # A storage group declared on the Job, overriding the single "Storage = File"
  # inherited from DefaultJob. None of the Pools in this test declare a
  # Storage, so DoNativeBackupInit does not rebuild the list from the Pool --
  # this is the Job-declared case that the console "run" command used to
  # collapse to one member before reaching the policy.
  Storage = File, File2
}
