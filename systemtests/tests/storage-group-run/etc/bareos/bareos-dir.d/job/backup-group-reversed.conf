Job {
  Name = "backup-group-reversed"
  JobDefs = "DefaultJob"
  Client = "bareos-fd"
  MaximumConcurrentJobs = 10

  # Same two members as backup-group, declared the other way round. Both are
  # enabled, so both are still offered to the Storage Daemon -- only the order
  # and the Director current choice differ. If the data lands on FileStorage2
  # then the policy ordering really does decide the device, rather than the
  # Storage Daemon picking for itself out of the menu it was handed.
  Storage = File2, File
}
