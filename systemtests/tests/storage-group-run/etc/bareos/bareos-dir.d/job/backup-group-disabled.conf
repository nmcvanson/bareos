Job {
  Name = "backup-group-disabled"
  JobDefs = "DefaultJob"
  Client = "bareos-fd"
  MaximumConcurrentJobs = 10

  # Same shape as backup-group, but the first member is disabled. The policy
  # filter must drop it, leaving one candidate, and the data must actually
  # land on File2's device.
  Storage = FileDisabled, File2
}
