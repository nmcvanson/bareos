Device {
  Name = FileStorageA
  Media Type = FileA
  Archive Device = storage/a
  LabelMedia = yes;
  Random Access = yes;
  AutomaticMount = yes;
  RemovableMedia = no;
  AlwaysOpen = no;
  Maximum Block Size = 64k

  # One job at a time, so a slow job can make this device busy while the
  # Director still counts FileA as free (its own limit is 10).
  Maximum Concurrent Jobs = 1
}
