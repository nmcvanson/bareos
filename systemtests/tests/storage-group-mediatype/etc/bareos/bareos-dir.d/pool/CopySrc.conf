# Source pool for the copy case, so the copy has exactly one job to copy.
Pool {
  Name = CopySrc
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 365 days
  Maximum Volume Bytes = 1G
  Maximum Volumes = 100
  Label Format = "CopySrc-"
  # FileB, not FileA: a copy may not read and write the same Storage, and
  # CopyDst writes to FileA.
  Storage = FileB
  Next Pool = CopyDst
}
