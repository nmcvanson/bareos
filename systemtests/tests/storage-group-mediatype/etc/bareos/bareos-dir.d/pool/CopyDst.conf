# The Next Pool the copy writes to, with two storages. The Director records
# the first, FileA, so the daemon must be offered FileA alone.
Pool {
  Name = CopyDst
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 365 days
  Maximum Volume Bytes = 1G
  Maximum Volumes = 100
  Label Format = "CopyDst-"
  # FileC, not FileB: FileB is the copy's read storage.
  Storage = FileA, FileC
}
