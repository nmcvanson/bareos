# Fixture for ConfigParser_Dir.StorageGroupPolicy
#
# Exercises the StorageGroupPolicy directive
# on both Job and Pool, with valid policy names.

Director {
  Name = "bareos-dir"
  Password = "secret"
  Messages = Standard
}

Messages {
  Name = Standard
  console = all
}

Storage {
  Name = "storage01"
  Address = localhost
  Password = "secret"
  Device = "dev1"
  MediaType = "Type"
}

Storage {
  Name = "storage02"
  Address = localhost
  Password = "secret"
  Device = "dev1"
  MediaType = "Type"
}

Client {
  Name = "client1"
  Address = localhost
  Password = "secret"
}

FileSet {
  Name = "fileset1"
  Include {
    File = "/tmp"
  }
}

Pool {
  Name = "pool-with-policy"
  Pool Type = Backup
  Storage = storage01, storage02
  Storage Group Policy = LeastUsed
}

Job {
  Name = "job-with-policy"
  Type = Backup
  Client = client1
  FileSet = fileset1
  Pool = pool-with-policy
  Messages = Standard
  Storage = storage01, storage02
  Storage Group Policy = ListedOrder
}

Job {
  Name = "job-without-policy"
  Type = Backup
  Client = client1
  FileSet = fileset1
  Pool = pool-with-policy
  Messages = Standard
  Storage = storage01
}
