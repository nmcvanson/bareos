# Fixture for ConfigParser_Dir.StorageGroupConnectTimeout
#
# The Director declares StorageGroupConnectTimeout with a non-default value, so
# that both the parsed field and the printer can be checked. The default case is
# covered by the StorageGroupPolicy fixture, whose Director declares none.
#
# This is a parser and printer fixture: it is enough for ParseConfig and for
# "bareos-dir --xc director", but not for a full "bareos-dir -t", which also
# requires at least one Job. The StorageGroupPolicy fixture covers that path.

Director {
  Name = "bareos-dir"
  Password = "secret"
  Messages = Standard
  Storage Group Connect Timeout = 90
}

Messages {
  Name = Standard
  console = all
}
