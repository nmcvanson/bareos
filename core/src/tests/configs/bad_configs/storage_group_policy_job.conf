# The Job names a policy that does not exist. Everything else is valid, so the
# only reason to reject this config is the policy name.

Director {
  Name = "bareos-dir"
  Password = "secret"
  Messages = Standard
}

Messages {
  Name = Standard
  console = all
}

Storage {
  Name = "storage01"
  Address = localhost
  Password = "secret"
  Device = "dev1"
  MediaType = "Type"
}

Client {
  Name = "client1"
  Address = localhost
  Password = "secret"
}

FileSet {
  Name = "fileset1"
  Include {
    File = "/tmp"
  }
}

Pool {
  Name = "pool1"
  Pool Type = Backup
}

Job {
  Name = "job-bad-policy"
  Type = Backup
  Client = client1
  FileSet = fileset1
  Pool = pool1
  Messages = Standard
  Storage = storage01
  Storage Group Policy = ThisPolicyDoesNotExist
}
